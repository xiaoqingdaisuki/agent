name: agent-ecs

x-agent-common: &agent-common
  restart: unless-stopped
  networks:
    - agent-internal
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-agent-environment: &agent-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  IMAGE_MODEL: ${IMAGE_MODEL:-step-image-edit-2}
  AGENT_DEADLINE_MS: ${AGENT_DEADLINE_MS:-30000}
  SERVER_REQUEST_TIMEOUT_MS: ${SERVER_REQUEST_TIMEOUT_MS:-40000}
  LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-12000}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
  MAX_AGENT_ITERATIONS: ${MAX_AGENT_ITERATIONS:-6}
  CORS_ORIGIN: ${CORS_ORIGIN:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-basic}
  SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-4500}
  SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-8}
  SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-30}
  SEARCH_STALE_TTL_SECONDS: ${SEARCH_STALE_TTL_SECONDS:-600}
  CLOUDFLARE_MEMORY_BASE_URL: ${CLOUDFLARE_MEMORY_BASE_URL}
  CLOUDFLARE_MEMORY_SECRET: ${CLOUDFLARE_MEMORY_SECRET}
  PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-false}
  NO_PROXY: ${NO_PROXY:-cloudflare-service.597178640.workers_dev,.workers.dev,localhost,127.0.0.1}
  no_proxy: ${no_proxy:-cloudflare-service.597178640.workers_dev,.workers.dev,localhost,127.0.0.1}

services:
  ts-agent:
    <<: *agent-common
    environment:
      <<: *agent-environment
    profiles: ["typescript"]
    build:
      context: ./ts-langchain
      dockerfile: Dockerfile
    ports:
      - "${TS_PUBLIC_PORT:-6001}:6001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:6001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  py-agent:
    <<: *agent-common
    profiles: ["python"]
    build:
      context: ./py-langgraph
      dockerfile: Dockerfile
    environment:
      <<: *agent-environment
      HOST: 0.0.0.0
      PORT: "6002"
    ports:
      - "${PY_PUBLIC_PORT:-6002}:6002"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:6002/api/v1/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  agent-internal:
    driver: bridge
