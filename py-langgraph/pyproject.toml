[project]
name = "py-langgraph-agent"
version = "0.1.0"
description = "LangGraph-based Agent service"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.1",
    "langchain-core>=0.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=6.18",
    "python-docx>=1.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
agent = "src.api.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",  # 工具代码中需要捕获所有异常并统一返回错误
    "S110",    # try-except-pass 在工具降级逻辑中常见
    "S112",    # try-except-continue 在循环中跳过失败实例
    "UP006",   # 使用 List/list — Python 3.10+ 才支持 lowercase，保持兼容
    "UP045",   # 同上，X | None 语法
    "RUF013",  # PEP 484 Optional — 保持向后兼容
    "F401",    # 部分文件有动态导入，暂不清理
    "I001",    # import 排序 — 逐步清理
    "DTZ005",  # datetime.now() 无 tz — 开发阶段暂不处理
    "F841",    # 未使用局部变量 — 逐步清理
]
